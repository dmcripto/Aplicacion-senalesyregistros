<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Agenda</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📅 Mi Agenda</h1>
  <div class="bar">
    <button id="txt" aria-label="Cambiar tamaño de texto">Aa</button>
    <button id="sound">🔔 Activar alarmas</button>
    <button id="ics">⬇ Exportar al teléfono (.ics)</button>
  </div>
</header>
<main>
  <div id="banner"></div>
  <div class="bar">
    <button id="prev" aria-label="Mes anterior">◀</button>
    <h2 id="title"></h2>
    <button id="next" aria-label="Mes siguiente">▶</button>
    <button id="today">Hoy</button>
  </div>
  <div class="grid" id="dow"></div>
  <div class="grid" id="grid"></div>

  <section class="card">
    <div class="bar"><h3 id="dayTitle" style="margin:0 auto 0 0"></h3><button class="primary" id="add">＋ Agregar</button></div>
    <div id="list"></div>
  </section>

  <section class="card">
    <h3 style="margin-top:0">Completar el mes automáticamente</h3>
    <p>Cargá todas las terapias y turnos de <b id="tplName"></b> una sola vez y tocá el botón. Desde ese momento, cada mes nuevo se llena solo: cada evento se repite el mismo día de la semana (ej.: «2.º martes»).</p>
    <div class="bar"><button class="primary" id="tpl">Usar este mes como modelo</button><button id="regen">Volver a generar los meses siguientes</button><button id="notpl">Dejar de repetir</button></div>
    <p id="tplInfo"></p>
  </section>
</main>

<dialog id="form">
  <form method="dialog" id="f">
    <h3 id="fTitle">Nuevo evento</h3>
    <label for="fName">¿Qué es?</label><input id="fName" required placeholder="Ej.: Terapia ocupacional">
    <label for="fType">Tipo</label>
    <select id="fType"><option value="terapia">Terapia</option><option value="turno">Turno médico</option><option value="otro">Otro</option></select>
    <label for="fDate">Fecha</label><input id="fDate" type="date" required>
    <label for="fTime">Hora</label><input id="fTime" type="time" required>
    <label for="fPlace">Lugar</label><input id="fPlace" placeholder="Ej.: Consultorio, calle…">
    <label for="fNotes">Notas (qué llevar, con quién…)</label><textarea id="fNotes" rows="2"></textarea>
    <label>Alarmas (antes del evento)</label>
    <div class="checks" id="fRemind">
      <label><input type="checkbox" value="1440">1 día</label>
      <label><input type="checkbox" value="120">2 h</label>
      <label><input type="checkbox" value="60">1 h</label>
      <label><input type="checkbox" value="30">30 min</label>
      <label><input type="checkbox" value="10">10 min</label>
      <label><input type="checkbox" value="0">A la hora</label>
    </div>
    <div class="bar" style="margin-top:1rem"><button class="primary" value="ok">Guardar</button><button value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>

<dialog id="alarm" aria-live="assertive">
  <h2 id="aTitle"></h2><p id="aBody"></p>
  <div class="bar" style="justify-content:center"><button class="primary" id="aOk">Entendido</button><button id="aSnooze">Avisarme en 5 min</button></div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
