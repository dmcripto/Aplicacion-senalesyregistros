    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DMCRIPTO" />
    <title>DMCRIPTO · Diario de Trading</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Registro del service worker (solo en https o localhost; en http se ignora sin romper nada)
      window.addEventListener("load", function () {
        var seguro =
          window.location.protocol === "https:" ||
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";
        if (seguro && "serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
