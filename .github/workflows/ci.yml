name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (web)
        run: npx tsc --noEmit -p .
      - name: Tipos (app)
        run: npx tsc --noEmit -p mobile
      - name: Pruebas
        run: npm test
      - name: Compilar la web
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
